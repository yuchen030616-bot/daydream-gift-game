<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" preserveAspectRatio="none" role="img" aria-label="原创木边皮革绿色毛毡21点牌桌">
<defs>
 <radialGradient id="wood" cx="48%" cy="28%" r="85%"><stop stop-color="#b16d36"/><stop offset=".3" stop-color="#73411f"/><stop offset=".62" stop-color="#9b5a2a"/><stop offset=".9" stop-color="#392316"/><stop offset="1" stop-color="#c08242"/></radialGradient>
 <linearGradient id="front" x2="0" y2="1"><stop stop-color="#735033"/><stop offset=".25" stop-color="#38251a"/><stop offset=".75" stop-color="#1b1715"/><stop offset="1" stop-color="#0b0b0a"/></linearGradient>
 <radialGradient id="leather" cx="48%" cy="23%" r="80%"><stop stop-color="#66503b"/><stop offset=".4" stop-color="#3c2f25"/><stop offset=".75" stop-color="#241e1b"/><stop offset="1" stop-color="#453628"/></radialGradient>
 <radialGradient id="felt" cx="50%" cy="31%" r="75%"><stop stop-color="#257351"/><stop offset=".35" stop-color="#1a6242"/><stop offset=".7" stop-color="#0d4b33"/><stop offset="1" stop-color="#073621"/></radialGradient>
