 <linearGradient id="shoe" x2="1" y2="1"><stop stop-color="#242b25"/><stop offset=".6" stop-color="#090d0b"/><stop offset="1" stop-color="#667067"/></linearGradient>
 <linearGradient id="chipEdge" x2="0" y2="1"><stop stop-color="#fff7d5" stop-opacity=".45"/><stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></linearGradient>
 <pattern id="grain" width="130" height="35" patternUnits="userSpaceOnUse"><path d="M-10 7Q35 0 75 9T145 5M-10 16Q40 29 90 17T145 25M-10 31Q45 18 95 29T145 28" fill="none" stroke="#dfae72" stroke-width="1.4" opacity=".2"/></pattern>
