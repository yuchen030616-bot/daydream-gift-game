 <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".7"/></filter>
 <clipPath id="woodClip"><ellipse cx="450" cy="491" rx="444" ry="475"/></clipPath>
 <clipPath id="feltClip"><ellipse cx="450" cy="469" rx="394" ry="420"/></clipPath>
 <path id="mainArc" d="M192 403 Q450 300 708 403"/>
 <path id="insuranceArc" d="M251 421 Q450 354 649 421"/>
