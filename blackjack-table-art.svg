<g transform="translate(104 164) rotate(-12)" opacity=".85" filter="url(#shadow)"><path d="M0 0L64 7L69 78L4 70Z" fill="#11261c" stroke="#6f8469" stroke-width="2"/><path d="M7 10L57 15L59 63L10 58Z" fill="#d9d4c1"/><path d="M12 20L54 24M12 26L55 30M13 32L55 36M13 38L56 42M14 44L56 48M14 50L57 54" stroke="#8f967c" stroke-width="1"/></g>

