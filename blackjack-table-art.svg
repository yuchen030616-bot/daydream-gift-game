<ellipse cx="450" cy="480" rx="428" ry="457" fill="url(#rim)"/>
<ellipse cx="450" cy="474" rx="419" ry="448" fill="url(#leather)" stroke="#100f0c" stroke-width="5"/>
<ellipse cx="450" cy="474" rx="409" ry="437" fill="none" stroke="#9f8966" stroke-opacity=".44" stroke-width="1.5" stroke-dasharray="5 6"/>
<ellipse cx="450" cy="469" rx="396" ry="422" fill="#d5b46e" opacity=".75"/>
