<ellipse cx="450" cy="544" rx="430" ry="479" fill="#000" opacity=".65" filter="url(#soft)"/>
<ellipse cx="450" cy="522" rx="444" ry="478" fill="url(#front)"/>
<ellipse cx="450" cy="491" rx="444" ry="475" fill="url(#wood)" stroke="#221b15" stroke-width="5"/>
